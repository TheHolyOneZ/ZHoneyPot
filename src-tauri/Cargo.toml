[package]
name = "zhoneypot"
version = "0.1.0"
description = "Local honeypot toolkit — fake credentials, folders, and API keys that alert when touched."
authors = ["theholyonez"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "zhoneypot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- Tauri ---
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart    = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = { version = "2", features = ["windows7-compat"] }
tauri-plugin-dialog       = "2"
tauri-plugin-fs           = "2"
tauri-plugin-store        = "2"
tauri-plugin-os           = "2"
tauri-plugin-opener       = "2"

libc = "0.2"

# --- Async ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "process", "io-util"] }

# --- Storage ---
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate", "time", "uuid"] }

# --- File watching ---
notify                 = "7"
notify-debouncer-full  = "0.4"

# --- Serialization ---
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs      = { version = "10", features = ["serde-compat"] }

# --- Error handling ---
thiserror = "2"
anyhow    = "1"

# --- Logging / tracing ---
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender   = "0.2"

# --- Alerts / notifications ---
notify-rust = { version = "4", default-features = false, features = ["d"] }

# --- Hash chain ---
blake3 = "1"

# --- IDs ---
uuid = { version = "1", features = ["v7", "serde"] }

# --- Time ---
time = { version = "0.3", features = ["serde", "serde-well-known", "formatting", "parsing"] }

# --- Filesystem / system ---
directories = "5"
procfs      = { version = "0.16", optional = true }
sysinfo     = "0.33"

# --- Token generation ---
rand        = "0.8"
rand_chacha = "0.3"
regex       = "1"
ed25519-dalek = "2"
rsa          = { version = "0.9", features = ["pem"] }
ssh-key      = { version = "0.6", features = ["ed25519", "encryption"] }
git2         = "0.19"

# --- HTTP (webhook / callback) ---
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
hmac    = "0.12"
sha2    = "0.10"

[features]
default       = ["linux-forensics"]
linux-forensics = ["dep:procfs"]

# Keep binary sizes reasonable in dev
[profile.dev]
incremental = true

[profile.release]
lto       = true
opt-level = "s"
strip     = true
